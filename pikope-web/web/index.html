<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="any">
  <meta name="description" content="PikoPe Web — Pool, Ludo and Carrom (same account as the Android app).">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PikoPe Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PikoPe Web</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      /* DesignColors.ink #070A18, lobby navy #0E1433 */
      background: radial-gradient(ellipse 120% 80% at 50% 0%, #121a3a 0%, #070A18 55%, #04060f 100%);
    }
    #load {
      box-sizing: border-box;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 28px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e9ecf5;
      text-align: center;
    }
    .logo {
      width: min(180px, 42vw);
      height: auto;
      margin-bottom: 4px;
      filter: drop-shadow(0 8px 24px rgba(245, 200, 66, 0.25));
    }
    .games {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      width: min(560px, 92vw);
      margin: 14px 0 16px;
    }
    .game-card {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(245, 200, 66, 0.12);
      animation: floatIn 0.7s ease backwards;
    }
    .game-card:nth-child(1) { animation-delay: 0.05s; }
    .game-card:nth-child(2) { animation-delay: 0.15s; }
    .game-card:nth-child(3) { animation-delay: 0.25s; }
    .game-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 320 / 200;
      object-fit: cover;
      vertical-align: middle;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0.9;
    }
    .spin {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(245, 200, 66, 0.22);
      border-top-color: #f5c842;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #load p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      max-width: 280px;
      color: #b8bfd4;
    }
    /* Phone: keep 3-up row, tighter — never stack full-width giant cards */
    @media (max-width: 520px) {
      #load { padding: 16px 12px 20px; }
      .logo { width: min(132px, 36vw); }
      .games {
        width: min(340px, 88vw);
        gap: 8px;
        margin: 10px 0 12px;
      }
      .game-card { border-radius: 10px; }
      .spin { width: 24px; height: 24px; }
      #load p { font-size: 12px; max-width: 240px; }
    }
  </style>
</head>
<body>
  <div id="load" aria-live="polite">
    <img class="logo" src="splash/pikope_logo.png" width="220" height="220" alt="PikoPe">
    <div class="games" aria-hidden="true">
      <div class="game-card"><img src="splash/game-pool.svg" alt="Pool"></div>
      <div class="game-card"><img src="splash/game-ludo.svg" alt="Ludo"></div>
      <div class="game-card"><img src="splash/game-carrom.svg" alt="Carrom"></div>
    </div>
    <div class="status">
      <div class="spin" aria-hidden="true"></div>
      <p>Loading game… first visit may take a moment.</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('load');
      if (el) el.remove();
    });
  </script>
</body>
</html>
