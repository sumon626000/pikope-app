name: billiard_poker
description: "PikoPe - Pool, Ludo and Carrom with online coin play."
publish_to: 'none'
version: 1.0.2+17

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  http: ^1.2.0
  image_picker: ^1.1.0
  web_socket_channel: ^3.0.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#1E1E21"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tables/
    - assets/images/avatars/
    - assets/audio/
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
