name: Deploy APK (landing download)

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - '.github/workflows/deploy-apk-hostinger.yml'
      - '.github/workflows/deploy-hostinger-all.yml'
  workflow_dispatch:

concurrency:
  group: deploy-apk-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Setup Gradle (cache + prefetch wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Warm Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "Gradle prefetch attempt $attempt failed; waiting 45s…"
            sleep 45
          done
          exit 1

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        env:
          PIKOPE_API_BASE_URL: ${{ vars.PIKOPE_API_BASE_URL }}
        shell: bash
        run: |
          API="${PIKOPE_API_BASE_URL:-https://adminnew.pikope.com}"
          set -e
          for attempt in 1 2 3; do
            if flutter build apk --release \
              --dart-define=API_BASE_URL="$API" \
              --target-platform android-arm,android-arm64,android-x64; then
              exit 0
            fi
            echo "APK build attempt $attempt failed; waiting 60s…"
            sleep 60
          done
          exit 1

      - name: Stage pikope-latest.apk
        run: |
          mkdir -p deploy/apk
          cp build/app/outputs/flutter-apk/app-release.apk deploy/apk/pikope-latest.apk

      - name: Deploy APK to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_API_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_API_FTP_USER }}
          password: ${{ secrets.HOSTINGER_API_FTP_PASSWORD }}
          local-dir: deploy/apk/
          server-dir: ${{ secrets.HOSTINGER_APK_FTP_REMOTE_DIR }}/
          log-level: minimal
