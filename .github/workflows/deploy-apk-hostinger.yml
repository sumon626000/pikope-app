name: Deploy APK (landing download)

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - '.github/workflows/deploy-apk-hostinger.yml'
      - '.github/workflows/deploy-hostinger-all.yml'
  workflow_dispatch:

concurrency:
  group: deploy-apk-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Bootstrap Gradle wrapper
        shell: pwsh
        working-directory: android
        run: |
          $ok = $false
          foreach ($attempt in 1..8) {
            try {
              & .\gradlew.bat --version
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            } catch {}
            Write-Host "Wrapper attempt $attempt failed; sleep 90s"
            Start-Sleep -Seconds 90
          }
          if (-not $ok) { exit 1 }

      - name: Decode release keystore
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String('${{ secrets.ANDROID_KEYSTORE_BASE64 }}')
          [IO.File]::WriteAllBytes('android/app/upload-keystore.jks', $bytes)

      - name: Write key.properties
        shell: pwsh
        run: |
          @"
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          "@ | Set-Content -Encoding ascii android/key.properties

      - name: Build release APK
        shell: pwsh
        env:
          PIKOPE_API_BASE_URL: ${{ vars.PIKOPE_API_BASE_URL }}
        run: |
          $api = if ($env:PIKOPE_API_BASE_URL) { $env:PIKOPE_API_BASE_URL } else { 'https://adminnew.pikope.com' }
          foreach ($attempt in 1..4) {
            flutter build apk --release `
              --dart-define=API_BASE_URL=$api `
              --target-platform android-arm,android-arm64,android-x64
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "APK build attempt $attempt failed; sleep 90s"
            Start-Sleep -Seconds 90
          }
          exit 1

      - name: Stage pikope-latest.apk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy/apk | Out-Null
          Copy-Item build/app/outputs/flutter-apk/app-release.apk deploy/apk/pikope-latest.apk

      - name: Deploy APK to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_API_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_API_FTP_USER }}
          password: ${{ secrets.HOSTINGER_API_FTP_PASSWORD }}
          local-dir: deploy/apk/
          server-dir: ${{ secrets.HOSTINGER_APK_FTP_REMOTE_DIR }}/
          log-level: minimal
