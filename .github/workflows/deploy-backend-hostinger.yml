name: Deploy backend (admin API)

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-hostinger.yml'
      - '.github/workflows/deploy-hostinger-all.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_API_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_API_FTP_USER }}
          password: ${{ secrets.HOSTINGER_API_FTP_PASSWORD }}
          local-dir: backend/
          server-dir: ${{ secrets.HOSTINGER_API_FTP_REMOTE_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/tests/**
            **/dist/**
            **/vendor/**
            **/node_modules/**
          log-level: minimal
